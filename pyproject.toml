[project]
name = "quorlo"
version = "0.0.1"
description = "Make your data AI-ready: scan, score, enrich and write back metadata."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Quorlo contributors" }]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Database",
]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "pydantic>=2.6",
    "psycopg[binary]>=3.1",
]

[project.urls]
Homepage = "https://github.com/Quorlo/quorlo"
Issues = "https://github.com/Quorlo/quorlo/issues"

[project.scripts]
quorlo = "quorlo.cli:app"

[project.entry-points."quorlo.connectors"]
postgres = "quorlo.connectors.postgres:PostgresConnector"

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quorlo"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]

[tool.ruff.lint.per-file-ignores]
# Table-shaped fixture data reads better unwrapped.
"tests/**" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-m", "not integration", "--strict-markers"]
markers = [
    "integration: needs a running database; set QUORLO_TEST_DSN and run with -m integration",
]


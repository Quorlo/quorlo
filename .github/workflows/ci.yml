name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --all-extras --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: uv sync --all-extras --locked
      - run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: quorlo
          POSTGRES_PASSWORD: quorlo
          POSTGRES_DB: quorlo_demo
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U quorlo -d quorlo_demo"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 30
    env:
      QUORLO_TEST_DSN: postgresql://quorlo:quorlo@localhost:55432/quorlo_demo
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      # Service containers cannot mount demo/seed.sql into the init directory, so load it here.
      - name: Seed demo database
        run: psql "$QUORLO_TEST_DSN" -v ON_ERROR_STOP=1 -f demo/seed.sql
      - run: uv sync --all-extras --locked
      - run: uv run pytest -m integration
